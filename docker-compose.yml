# API + SQL Server para desarrollo/demo local.
#
#   copy .env.example .env      (completar MSSQL_SA_PASSWORD y JWT_SIGNING_KEY)
#   docker compose up --build
#   curl http://localhost:8080/health
#
# La API corre en Production: sin JWT_SIGNING_KEY no arranca, y Swagger no se expone.
# Las migraciones se aplican al arrancar la API (Program.cs).

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Definir MSSQL_SA_PASSWORD en .env}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    image: turning-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=Turning;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Definir JWT_SIGNING_KEY en .env}
      Ai__OpenAi__ApiKey: ${OPENAI_API_KEY:-DUMMY-REEMPLAZAR-Ai__OpenAi__ApiKey}
      Ai__OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-DUMMY-REEMPLAZAR-Ai__OpenRouter__ApiKey}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:5173}

volumes:
  mssql-data:
